name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-detection:
    name: 🔍 Change
    uses: rotmanjanez/workflows/.github/workflows/reusable-change-detection.yml@16f50387bbc131c45a365423343af8acf489edec # feat/python-version-matrix
    with:
      additional-python-files: "mlir/**"
    permissions:
      contents: read

  python-build:
    name: 🐍 Build
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-build.yml@16f50387bbc131c45a365423343af8acf489edec # feat/python-version-matrix
    with:
      compiled: true
      setup-mlir: true
      llvm-version: 22.1.8
    secrets: inherit
    permissions:
      contents: read

  python-tests:
    name: 🐍 Test
    needs: [change-detection, python-lint, python-build]
    if: >-
      !cancelled()
      && fromJSON(needs.change-detection.outputs.run-python-tests)
      && needs.python-lint.result != 'failure'
      && needs.python-build.result == 'success'
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-tests.yml@16f50387bbc131c45a365423343af8acf489edec # feat/python-version-matrix
    with:
      compiled: true
      # the fork is not registered with Codecov; the upload would always fail
      enable-coverage: false
      setup-mlir: true
      llvm-version: 22.1.8
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  cpp-tests:
    name: 🇨 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: rotmanjanez/workflows/.github/workflows/reusable-cpp-tests.yml@16f50387bbc131c45a365423343af8acf489edec # feat/python-version-matrix
    with:
      # the fork is not registered with Codecov; the upload would always fail
      enable-coverage: false
      setup-mlir: true
      llvm-version: 22.1.8
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  python-lint:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-linter.yml@16f50387bbc131c45a365423343af8acf489edec # feat/python-version-matrix
    with:
      check-stubs: true
      enable-ty: true
      enable-mypy: false
      setup-mlir: true
      llvm-version: 22.1.8
    secrets: inherit
    permissions:
      contents: read

  cpp-lint:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: rotmanjanez/workflows/.github/workflows/reusable-cpp-linter.yml@16f50387bbc131c45a365423343af8acf489edec # feat/python-version-matrix
    with:
      clang-version: 22
      build-project: true
      setup-python: true
      install-pkgs: "nanobind==3.0.0"
      cpp-linter-extra-args: "-std=c++20 -Wunused-template"
      # Vendored third-party headers are checked upstream and are not maintained
      # according to MQT Core's clang-tidy configuration.
      cpp-linter-ignore-extra: "vendor/**"
      setup-mlir: true
      llvm-version: 22.1.8
    permissions:
      contents: read
      pull-requests: write # Needed to post review comments

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      [
        change-detection,
        python-build,
        python-tests,
        cpp-tests,
        python-lint,
        cpp-lint,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled') }}
        run: exit 1
