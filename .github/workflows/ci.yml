name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  cpp:
    name: 🇨
    uses: rotmanjanez/workflows/.github/workflows/reusable-cpp-ci.yml@396397c98df6c7d884c7fd56911c3fdb64d735fb # feat/python-version-matrix
    with:
      # the fork is not registered with Codecov; the upload would always fail
      enable-coverage: false
      clang-version: 22
      build-project: true
      setup-python: true
      install-pkgs: "nanobind==3.0.0"
      cpp-linter-extra-args: "-std=c++20 -Wunused-template"
      # Vendored third-party headers are checked upstream and are not maintained
      # according to MQT Core's clang-tidy configuration.
      cpp-linter-ignore-extra: "vendor/**"
      setup-mlir: true
      llvm-version: 22.1.8
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write # Needed to post review comments
      id-token: write

  python:
    name: 🐍
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-ci.yml@396397c98df6c7d884c7fd56911c3fdb64d735fb # feat/python-version-matrix
    with:
      additional-python-files: "mlir/**"
      compiled: true
      check-stubs: true
      enable-ty: true
      enable-mypy: false
      # the fork is not registered with Codecov; the upload would always fail
      enable-coverage: false
      setup-mlir: true
      llvm-version: 22.1.8
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs: [cpp, python]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled') }}
        run: exit 1
